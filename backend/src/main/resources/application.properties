spring.application.name=clinic-booking

# In-memory database. Recreated on every start, so tests and CI need no setup.
spring.datasource.url=jdbc:h2:mem:clinicdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Browse the database at http://localhost:8080/h2-console while developing
spring.h2.console.enabled=true

# Do not cache templates during development
spring.thymeleaf.cache=false

server.port=8080
