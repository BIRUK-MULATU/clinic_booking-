name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ubuntu-latest ships Google Chrome already; Selenium Manager
      # finds it on its own, so no extra browser install step is needed.
      - name: Build, test and check coverage gate
        run: mvn --batch-mode clean verify

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## JaCoCo branch coverage - et.aau.clinic.core"
            echo ""
            echo "| Class | Branches covered | Branches missed | Coverage |"
            echo "|---|---|---|---|"
            awk -F',' '
              NR == 1 { next }
              $2 == "et.aau.clinic.core" {
                covered = $7; missed = $6
                total_covered += covered; total_missed += missed
                pct = (covered + missed > 0) ? 100 * covered / (covered + missed) : 0
                printf "| %s | %d | %d | %.1f%% |\n", $3, covered, missed, pct
              }
              END {
                total = total_covered + total_missed
                pct = (total > 0) ? 100 * total_covered / total : 0
                printf "| **TOTAL** | **%d** | **%d** | **%.1f%%** |\n", total_covered, total_missed, pct
              }
            ' target/site/jacoco/jacoco.csv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
